{% extends "base.html" %}
{% block title %}运维记录 - 智能故障预警系统{% endblock %}
{% block content %}
<h2 class="page-title">历史运维处置记录</h2>

<div class="panel">
    <div class="toolbar">
        <button class="btn btn-primary" onclick="loadMaintenance()">刷新记录</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>记录ID</th><th>关联告警ID</th><th>设备编号</th><th>告警级别</th>
                <th>告警内容</th><th>运维处置措施</th><th>处理人</th><th>处置时间</th>
            </tr>
        </thead>
        <tbody id="main-tbody"></tbody>
    </table>
    <div class="empty" id="main-empty" style="display:none;">暂无运维处置记录，请先在告警面板处理告警</div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadMaintenance(){
    const res = await api('/api/maintenance');
    const rows = res.data;
    document.getElementById('main-empty').style.display = rows.length?'none':'block';
    document.getElementById('main-tbody').innerHTML = rows.map(m=>{
        const sevTag = m.severity==='高危'?'tag-high':m.severity==='中危'?'tag-mid':'tag-normal';
        return `<tr>
            <td>${m.id}</td>
            <td>${m.alert_id}</td>
            <td><b>${m.device_id}</b></td>
            <td>${m.severity?`<span class="tag ${sevTag}">${m.severity}</span>`:'-'}</td>
            <td style="max-width:260px;font-size:12px;">${m.alert_message||'-'}</td>
            <td style="max-width:260px;">${m.action}</td>
            <td>${m.operator}</td>
            <td>${m.create_time}</td>
        </tr>`;
    }).join('');
}
loadMaintenance();
</script>
{% endblock %}
