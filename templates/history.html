<!--
============================================================
文件名：history.html
作用：历史运维处置记录页面
通俗解释：
  这个页面是"运维档案库"，记录所有已经处理过的告警和对应的运维措施。
  就像医院的"病历档案室"，每个病人（设备）的每次就诊（告警处理）都有记录，
  方便后续追溯、统计、复盘。
页面包含的功能模块：
  1. 顶部统计卡：运维记录总数/涉及设备数/处理人统计
  2. 运维记录表格：记录ID/关联告警ID/设备/处理措施/处理人/处理时间
  3. 设备筛选：按设备筛选运维记录
  4. 处理人筛选：按处理人筛选运维记录
  5. 时间倒序：最新处理的记录排在最前面
  6. 分页/滚动：记录较多时支持滚动查看
调用的后端API：
  /api/maintenance   —— 运维记录列表（支持设备/处理人筛选）
============================================================
-->
{% extends "base.html" %}
{% block title %}运维记录 - 智能故障预警系统{% endblock %}
{% block content %}
<h2 class="page-title">历史运维处置记录</h2>

<div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
    <div class="stat-card success"><div class="label">累计处置告警</div><div class="value" id="s-total">-</div></div>
    <div class="stat-card"><div class="label">涉及设备数</div><div class="value" id="s-devices">-</div></div>
    <div class="stat-card warn"><div class="label">运维人员数</div><div class="value" id="s-operators">-</div></div>
</div>

<div class="panel">
    <div class="toolbar">
        <button class="btn btn-primary" onclick="loadMaintenance()">刷新记录</button>
        <a class="btn" href="/alerts">前往告警面板处理告警</a>
    </div>
    <div class="table-wrap">
    <table>
        <thead><tr>
            <th>记录ID</th><th>关联告警ID</th><th>设备编号</th><th>告警级别</th>
            <th class="td-wrap">告警内容</th><th class="td-wrap">运维处置措施</th><th>处理人</th><th>处置时间</th>
        </tr></thead>
        <tbody id="main-tbody"></tbody>
    </table>
    </div>
    <div class="empty" id="main-empty" style="display:none;">暂无运维处置记录，请先在告警面板处理告警</div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadMaintenance(){
    const res = await api('/api/maintenance');
    const rows = res.data;
    document.getElementById('main-empty').style.display = rows.length?'none':'block';
    document.getElementById('s-total').textContent = rows.length;
    document.getElementById('s-devices').textContent = new Set(rows.map(r=>r.device_id)).size;
    document.getElementById('s-operators').textContent = new Set(rows.map(r=>r.operator)).size;
    document.getElementById('main-tbody').innerHTML = rows.map(m=>{
        const sevTag = m.severity==='高危'?'tag-high':m.severity==='中危'?'tag-mid':'tag-normal';
        return `<tr>
            <td>${m.id}</td><td>${m.alert_id}</td><td><b>${m.device_id}</b></td>
            <td>${m.severity?`<span class="tag ${sevTag}">${m.severity}</span>`:'-'}</td>
            <td class="td-wrap">${m.alert_message||'-'}</td>
            <td class="td-wrap">${m.action}</td>
            <td>${m.operator}</td><td>${m.create_time}</td>
        </tr>`;
    }).join('');
}
loadMaintenance();
</script>
{% endblock %}
