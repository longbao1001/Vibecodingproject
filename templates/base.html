<!--
============================================================
文件名：base.html
作用：网站基础模板（所有页面的"骨架"）
通俗解释：
  这个文件是所有网页的"公共骨架"，就像房子的承重墙和水电管线。
  其他4个页面（index/monitor/alerts/history）都继承这个基础模板，
  只需要填写自己的"内容区"，不用重复写导航栏、CSS引用、JS引用等公共部分。
包含的公共部分：
  1. <head>：网页标题、CSS样式表引用、ECharts图表库引用
  2. <nav>：顶部导航栏（4个页面的跳转链接，当前页自动高亮）
  3. <div class="container">：内容容器（其他页面的内容填在这里）
  4. 通用JS函数：api()封装fetch请求，方便其他页面调用后端接口
模板语法（子页面继承后填写对应区块）：
    block title    —— 页面标题占位，子页面可以覆盖
    block content  —— 页面内容占位，子页面必须填写
    block scripts  —— 页面专属JS占位，子页面可以填写
============================================================
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}智能故障预警系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">车间设备智能故障预警系统</div>
        <div class="nav-links">
            <a href="/" id="nav-index">设备总览</a>
            <a href="/monitor" id="nav-monitor">传感器监控</a>
            <a href="/alerts" id="nav-alerts">告警面板</a>
            <a href="/history" id="nav-history">运维记录</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
        // 高亮当前导航
        (function(){
            const path = location.pathname;
            const map = {'/':'nav-index','/monitor':'nav-monitor','/alerts':'nav-alerts','/history':'nav-history'};
            const id = map[path];
            if(id) document.getElementById(id).classList.add('active');
        })();
        // 通用请求封装
        async function api(url, options){
            const resp = await fetch(url, options);
            return resp.json();
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
